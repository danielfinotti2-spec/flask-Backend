<!doctype html>
<html lang="pt-BR"><head>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body id="top"><div id="wrap">
  <header><div class="logotitle">
    <a href="{{ url_for('home') }}"><img class="avatar" src="{{ url_for('static', filename='assets/logo.png') }}" alt="Foto de Daniel Finotti"></a>
    <div><span class="eyebrow">PERFIL PESSOAL</span><h1>Daniel Finotti</h1><p class="subtitle"><i class="fa-brands fa-python"></i> • <i class="fa-brands fa-js"></i> • <i class="fa-brands fa-html5"></i> • <i class="fa-brands fa-css"></i> </p></div>
  </div></header>
  <nav aria-label="Navegação principal">
            <a href="{{ url_for('home') }}"><i class="fa-solid fa-house"></i> Início</a>
            <a href="{{ url_for('sobre') }}"><i class="fa-solid fa-user"></i> Sobre</a>

        </nav>
  <main class="sobre-main"><section class="sobre-bloco contact-form-card">
    <p class="section-label">Mensagem</p><h2>Envie sua mensagem</h2>
    <form class="contact-form" action="{{ url_for('fazcontato') }}" method="post">
      <div class="mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" type="email" name="email" placeholder="seuemail@exemplo.com" required></div>
      <div class="mb-3"><label class="form-label" for="numero">Número</label><input class="form-control" id="numero" type="tel" name="numero" placeholder="(00) 00000-0000"></div>
      <div class="mb-4"><label class="form-label" for="mensagem">Mensagem</label><textarea class="form-control" id="mensagem" name="mensagem" rows="5"></textarea></div>
      <button class="btn contact-submit" type="submit">Enviar mensagem</button>
    </form>
  </section></main>
  <footer><a href="{{ url_for('home') }}">Início</a><span>© 2026 Daniel Finotti</span><a href="#top">Topo</a></footer>
